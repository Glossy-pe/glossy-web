@let p = product();

<article
  class="group relative flex h-full flex-col border-2 border-[#DDF4FF] bg-white p-4 shadow-[6px_6px_0px_#F0FAFF]"
  [class.opacity-60]="!p.active">

  <!-- Imagen -->
  <a [routerLink]="['/guest/products', p.id]"
     class="relative block aspect-square overflow-hidden bg-[#FFFDF9]">

    @if (mainImageUrl(); as url) {
      <img
        [src]="url | cfImage:thumbWidth"
        [alt]="p.name"
        width="400" height="400"
        decoding="async"
        [attr.loading]="priority() ? 'eager' : 'lazy'"
        [attr.fetchpriority]="priority() ? 'high' : 'auto'"
        class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110" />
    } @else {
      <div class="flex h-full w-full flex-col items-center justify-center gap-2 bg-[#FFFDF9]">
        <svg class="h-6 w-6 text-[#FF8DA1] opacity-70" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2l2.4 6.4L20.8 10.8l-6.4 2.4L12 22l-2.4-6.4-6.4-2.4 6.4-2.4z"/>
        </svg>
        <span class="text-[9px] font-black uppercase tracking-widest text-[#FF8DA1]">Coming Soon ✨</span>
      </div>
    }

    <!-- Overlay sutil en hover -->
    <div class="pointer-events-none absolute inset-0 bg-[#FF8DA1]/5 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
  </a>

  <!-- Detalles -->
  <div class="flex flex-1 flex-col pt-2">
    <div class="mb-2 flex-1">
      <h3 class="line-clamp-2 text-xs font-black uppercase leading-tight tracking-tighter text-gray-800 sm:text-sm">
        <a [routerLink]="['/guest/products', p.id]"
           [title]="p.name"
           class="transition-colors hover:text-[#FF8DA1]">
          {{ p.name }}
        </a>
      </h3>

      <p class="truncate text-[11px] text-gray-400">{{ p.description }}</p>
    </div>

    <!-- Precio + acción -->
    <div class="mt-auto flex items-center justify-between border-t border-[#F0FAFF]">
      <span class="text-sm font-black text-[#FF8DA1] sm:text-base">
        @if (price() !== null) {
          {{ price() | currency:'PEN':'symbol-narrow' }}
        } @else {
          S/ --
        }
      </span>

      <a [routerLink]="['/guest/products', p.id]"
         aria-label="Ver producto"
         class="ml-auto flex h-8 w-8 items-center justify-center bg-[#F0FAFF] text-[#49B6D6] transition-colors hover:bg-[#49B6D6] hover:text-white">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
      </a>
    </div>
  </div>

  <!-- Línea decorativa inferior -->
  <div class="absolute bottom-0 left-0 h-1 w-full origin-left scale-x-0 bg-[#FF8DA1] transition-transform duration-500 group-hover:scale-x-100"></div>
</article>

<div class="rounded-xl border border-gray-200 bg-white shadow-sm">
  <button type="button" class="flex w-full items-center justify-between px-4 py-2.5 text-left"
    [attr.aria-expanded]="open()" (click)="open.set(!open())">
    <span class="text-sm font-semibold text-gray-800">Crear variantes en lote</span>
    <span class="text-gray-400" aria-hidden="true">{{ open() ? '▴' : '▾' }}</span>
  </button>

  @if (open()) {
  <div class="space-y-3 border-t border-gray-100 p-3">
    @if (error()) { <p class="rounded-md bg-red-50 px-2 py-1 text-xs text-red-600">{{ error() }}</p> }
    @if (ok()) { <p class="rounded-md bg-emerald-50 px-2 py-1 text-xs text-emerald-700">{{ ok() }}</p> }

    <div class="grid grid-cols-2 gap-2 sm:grid-cols-5">
      <label class="text-xs text-gray-500">Cantidad
        <input type="number" min="1" max="100" [ngModel]="count()" (ngModelChange)="count.set($event)"
          class="mt-0.5 h-9 w-full rounded-lg border border-gray-200 px-2 text-sm" />
      </label>
      <label class="text-xs text-gray-500">Costo (S/)
        <input type="number" min="0" step="0.01" [ngModel]="cost()" (ngModelChange)="cost.set($event)"
          class="mt-0.5 h-9 w-full rounded-lg border border-gray-200 px-2 text-sm" />
      </label>
      <label class="text-xs text-gray-500">Precio (S/)
        <input type="number" min="0" step="0.01" [ngModel]="price()" (ngModelChange)="price.set($event)"
          class="mt-0.5 h-9 w-full rounded-lg border border-gray-200 px-2 text-sm" />
      </label>
      <label class="text-xs text-gray-500">Stock (cada una)
        <input type="number" min="0" [ngModel]="stock()" (ngModelChange)="stock.set($event)"
          class="mt-0.5 h-9 w-full rounded-lg border border-gray-200 px-2 text-sm" />
      </label>
      <label class="text-xs text-gray-500">Color base
        <input type="color" [ngModel]="toneCode()" (ngModelChange)="toneCode.set($event)"
          class="mt-0.5 h-9 w-full rounded-lg border border-gray-200 p-1" />
      </label>
    </div>

    <p class="text-xs text-gray-400">
      Se crearán {{ count() ?? 0 }} variantes (#1, #2…, continuando desde la última posición existente),
      con posición igual a su número.
    </p>

    <button type="button" [disabled]="!canSubmit()" (click)="submit()"
      class="h-9 rounded-lg bg-gray-900 px-5 text-sm font-semibold text-white hover:bg-gray-700 disabled:opacity-40">
      {{ saving() ? 'Creando...' : 'Crear variantes' }}
    </button>
  </div>
  }
</div>

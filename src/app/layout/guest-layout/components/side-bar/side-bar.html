@if (sidebar.isOpen()) {
  <div class="fixed inset-0 z-40 bg-black/20 backdrop-blur-[1px]"
       aria-hidden="true" (click)="sidebar.close()"></div>

  <aside role="dialog" aria-modal="true" aria-label="Menú principal"
    class="fixed top-0 left-0 z-50 flex h-full w-64 flex-col border-r-2 border-dashed border-[#FFDDE4] bg-white">

    <div class="flex items-center justify-between border-b-2 border-dashed border-[#FFDDE4] px-4 py-3">
      <span class="text-xs font-black uppercase tracking-widest text-[#FF8DA1]">Menú</span>
      <button type="button" aria-label="Cerrar menú" (click)="sidebar.close()"
        class="text-[#FF8DA1] hover:bg-[#FFF5F7] rounded p-1 transition-colors cursor-pointer">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <nav class="flex flex-col gap-1 overflow-y-auto p-3" aria-label="Navegación principal">

      <a routerLink="/guest/products" (click)="sidebar.close()"
        class="block px-2 py-2 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-[#FF8DA1] transition-colors">
        🏠 Inicio
      </a>

      <div class="my-1 border-t border-dashed border-[#FFDDE4]"></div>

      <div>
        <button type="button" (click)="toggleProducts()"
          [attr.aria-expanded]="productsOpen()" aria-controls="products-menu"
          class="flex w-full items-center justify-between px-2 py-2 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-[#FF8DA1] cursor-pointer transition-colors">
          <span>📦 Productos</span>
          <svg class="h-3 w-3 transition-transform" [class.rotate-180]="productsOpen()"
            fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        @if (productsOpen()) {
          <div id="products-menu">
            <a routerLink="/guest/products"
              [queryParams]="{ sort: 'newest', categoryId: null, page: null }"
              queryParamsHandling="merge" (click)="sidebar.close()"
              class="block px-4 py-1.5 text-[11px] font-bold text-[#FF8DA1]">
              ✨ Nuevos ingresos
            </a>
            @for (cat of categories(); track cat.id) {
              <a routerLink="/guest/products"
                [queryParams]="{ categoryId: cat.id, page: null }"
                queryParamsHandling="merge" (click)="sidebar.close()"
                class="block px-4 py-1.5 text-[11px] font-bold text-gray-600 hover:text-[#FF8DA1] transition-colors">
                {{ cat.name }}
              </a>
            }
          </div>
        }
      </div>
    </nav>
  </aside>
}

<header class="hdr">

  @if (snowOn()) {
    <div class="snow" aria-hidden="true">
      @for (f of flakes; track $index) {
        <i class="flake" [class.star]="f.star" [attr.data-d]="f.d"
           [style.left.%]="f.x"
           [style.width.px]="f.size" [style.height.px]="f.size"
           [style.animation-duration.s]="f.dur"
           [style.animation-delay.s]="f.delay"></i>
      }
    </div>
  }

  <nav class="nav">
    <div class="nav-content">
<div class="flex items-center gap-3">
  <button type="button" (click)="sidebar.toggle()"
    aria-label="Abrir menú" [attr.aria-expanded]="sidebar.isOpen()"
    class="flex flex-col gap-1 p-2 rounded-lg bg-white border border-[#FFDDE4] shadow-sm text-[#FF8DA1] hover:bg-[#FFF5F7] transition-colors cursor-pointer">
    <span class="block h-0.5 w-4 bg-current rounded-full"></span>
    <span class="block h-0.5 w-4 bg-current rounded-full"></span>
    <span class="block h-0.5 w-4 bg-current rounded-full"></span>
  </button>

  <a routerLink="/guest/products" class="logo" aria-label="Glossy">
    <img src="https://res.cloudinary.com/dqyqtgkdk/image/upload/v1782394206/Gemini-Generated-Image-a8qjlfa8qjlfa8qj_zfhhsx.png" alt="Glossy logo"
         width="auto" height="32" class="h-8 w-auto object-contain" />
    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3"></span>
  </a>
</div>

      <!-- Contenedor derecho: Enlace + Switch de nieve -->
      <div class="nav-actions">
        <!-- <a routerLink="/advent-calendar" routerLinkActive="active" class="advent-btn" aria-label="Calendario de Adviento">
          <span class="cute-sparkle">✨</span>
          <span class="btn-text">Calendario</span>
          <span class="mini-star">✦</span>
        </a> -->

        <button
          type="button"
          class="snow-toggle"
          role="switch"
          [attr.aria-checked]="snowOn()"
          [attr.aria-label]="snowOn() ? 'Desactivar nieve' : 'Activar nieve'"
          (click)="toggleSnow()">
          <span class="snow-label">nieve</span>
          <span class="track" [class.on]="snowOn()">
            <span class="knob">❄</span>
          </span>
        </button>
      </div>
    </div>
  </nav>
</header>

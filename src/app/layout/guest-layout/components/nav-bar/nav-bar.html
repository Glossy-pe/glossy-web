<header class="hdr">

  @if (snowOn()) {
    <div class="snow" aria-hidden="true">
      @for (f of flakes; track $index) {
        <i class="flake" [class.star]="f.star" [attr.data-d]="f.d"
           [style.left.%]="f.x"
           [style.width.px]="f.size" [style.height.px]="f.size"
           [style.animation-duration.s]="f.dur"
           [style.animation-delay.s]="f.delay"></i>
      }
    </div>
  }

  <nav class="nav">
    <div class="nav-content">
      <!-- Logo alineado a la izquierda -->
      <a routerLink="/guest/products" class="logo" aria-label="Glossy">
        <img
          src="https://res.cloudinary.com/dqyqtgkdk/image/upload/v1782394206/Gemini-Generated-Image-a8qjlfa8qjlfa8qj_zfhhsx.png"
          alt="Glossy logo"
          class="h-8 w-auto object-contain"
        />
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
      </a>

      <!-- Contenedor derecho: Enlace + Switch de nieve -->
      <div class="nav-actions">
        <a routerLink="/advent-calendar" routerLinkActive="active" class="advent-btn" aria-label="Calendario de Adviento">
          <span class="cute-sparkle">✨</span>
          <span class="btn-text">Calendario</span>
          <span class="mini-star">✦</span>
        </a>

        <button
          type="button"
          class="snow-toggle"
          role="switch"
          [attr.aria-checked]="snowOn()"
          [attr.aria-label]="snowOn() ? 'Desactivar nieve' : 'Activar nieve'"
          (click)="toggleSnow()">
          <span class="snow-label">nieve</span>
          <span class="track" [class.on]="snowOn()">
            <span class="knob">❄</span>
          </span>
        </button>
      </div>
    </div>
  </nav>
</header>
